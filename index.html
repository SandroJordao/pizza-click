<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Pizza Click</title>
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
		<link rel="preload" href="css/fonts/PressStart2P.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="stylesheet" href="css/style.css">
		<script src="js/main.js" defer></script>
	</head>
	<body>
		<section class="home" id="home" aria-labelledby="home-title">
			<div class="rain" id="rain" aria-hidden="true"></div>
			<div class="home-hero" aria-hidden="true">
				<div class="hero-pizza" id="hero-pizza"></div>
			</div>
			<h1 class="home-title" id="home-title"><span>PIZZA</span> <span>CLICK</span></h1>
			<p class="home-tagline">Monte as pizzas antes que esfriem!</p>
			<nav class="menu" id="menu" aria-label="Menu">
				<button class="menu-item" id="menu-play">JOGAR</button>
				<button class="menu-item" id="menu-help">INSTRUÇÕES</button>
				<button class="menu-item" id="menu-ranking">RANKING</button>
				<button class="menu-item" id="menu-sound" aria-pressed="true">SOM: <span id="sound-state">LIGADO</span></button>
			</nav>
			<p class="home-footer">
				<span>RECORDE <span class="highlight" id="home-record">0</span></span>
				<span id="home-top" hidden>1º LUGAR <span class="highlight" id="home-top-name"></span> <span id="home-top-score"></span></span>
			</p>
		</section>
		<div class="game" id="game" hidden>
			<main class="board" id="board">
				<!-- As 6 pizzas são geradas pelo main.js -->
				<div class="hud hud-time">
					<div class="label">TEMPO</div>
					<div class="clock" id="clock">00:00</div>
					<div class="label">FASE <span id="level">1</span></div>
				</div>
				<div class="center" id="center">
					<div class="plate">
						<div class="rand" id="rand"></div>
					</div>
					<div class="timer"><div class="timer-fill" id="timer-fill"></div></div>
					<div class="pause-label">PAUSA</div>
				</div>
				<div class="hud hud-score">
					<div class="score-line">
						<img src="img/pizza.png" alt="Pontos" width="64" height="64">
						<span>x <span id="score">0</span></span>
					</div>
					<div class="label">RECORDE <span id="record">0</span></div>
				</div>
				<div class="actions">
					<button id="btn-pause" aria-label="Pausar (Espaço)" title="Pausar (Espaço)"><i class="icon-pause"></i></button>
					<button id="btn-exit" aria-label="Sair para o início (Esc)" title="Sair para o início (Esc)">
						<svg class="pixel" viewBox="0 0 12 12" aria-hidden="true">
							<path fill="currentColor" d="M5 0H7V1H8V2H9V3H10V4H11V5H12V6H11V12H7V8H5V12H1V6H0V5H1V4H2V3H3V2H4V1H5Z"/>
						</svg>
					</button>
				</div>
				<div class="hud hud-lives">
					<div class="label">VIDAS</div>
					<div class="hearts">
						<img id="life-1" src="img/life-1.png" alt="Vida 1" width="48" height="51">
						<img id="life-2" src="img/life-2.png" alt="Vida 2" width="48" height="51">
						<img id="life-3" src="img/life-3.png" alt="Vida 3" width="48" height="51">
					</div>
				</div>
			</main>
		</div>
		<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
			<div class="modal-box">
				<h2 id="modal-title"></h2>
				<div class="modal-body" id="modal-body"></div>
				<div class="modal-actions" id="modal-actions"></div>
			</div>
		</div>
	</body>
</html>
