<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Jogo da Pizza</title>
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
		<link rel="preload" href="css/fonts/PressStart2P.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="stylesheet" href="css/style.css">
		<script src="js/main.js" defer></script>
	</head>
	<body>
		<h1 class="title">JOGO DA PIZZA</h1>
		<main class="board" id="board">
			<!-- As 6 pizzas são geradas pelo main.js -->
			<div class="hud hud-time">
				<div class="label">TEMPO</div>
				<div class="clock" id="clock">00:00</div>
				<div class="label">FASE <span id="level">1</span></div>
			</div>
			<div class="center" id="center">
				<div class="plate">
					<div class="rand" id="rand"></div>
				</div>
				<div class="timer"><div class="timer-fill" id="timer-fill"></div></div>
				<div class="pause-label">PAUSA</div>
			</div>
			<div class="hud hud-score">
				<div class="score-line">
					<img src="img/pizza.png" alt="Pontos" width="64" height="64">
					<span>x <span id="score">0</span></span>
				</div>
				<div class="label">RECORDE <span id="record">0</span></div>
			</div>
			<div class="actions">
				<button id="btn-play" aria-label="Jogar (Espaço)" title="Jogar (Espaço)"><i class="icon-play"></i></button>
				<button id="btn-pause" aria-label="Pausar (Espaço)" title="Pausar (Espaço)" hidden><i class="icon-pause"></i></button>
				<button id="btn-reload" aria-label="Reiniciar (R)" title="Reiniciar (R)" hidden><i class="icon-reload"></i></button>
				<button id="btn-sound" aria-label="Som (M)" title="Som (M)">
					<svg viewBox="2 3 21 18" aria-hidden="true">
						<path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
						<g class="sound-on" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
							<path d="M16 9a4 4 0 0 1 0 6"/>
							<path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/>
						</g>
						<g class="sound-off" stroke="currentColor" stroke-width="2" stroke-linecap="round">
							<path d="M16 9l6 6M22 9l-6 6"/>
						</g>
					</svg>
				</button>
			</div>
			<div class="hud hud-lives">
				<div class="label">VIDAS</div>
				<div class="hearts">
					<img id="life-1" src="img/life-1.png" alt="Vida 1" width="48" height="51">
					<img id="life-2" src="img/life-2.png" alt="Vida 2" width="48" height="51">
					<img id="life-3" src="img/life-3.png" alt="Vida 3" width="48" height="51">
				</div>
			</div>
		</main>
		<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
			<div class="modal-box">
				<h2 id="modal-title"></h2>
				<div class="modal-body" id="modal-body"></div>
				<button class="modal-ok" id="modal-ok"></button>
			</div>
		</div>
	</body>
</html>
